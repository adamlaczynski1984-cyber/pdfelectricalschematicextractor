<html>
  <head>
    <meta charset="utf-8" />
    <title>PDF Electrical Schematic Extractor</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background: #f4f7fb;
        color: #222;
      }
      .card {
        max-width: 900px;
        margin: 0 auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      }
      h1 { color: #1d3557; }
      form {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      input[type="file"] {
        padding: 10px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        cursor: pointer;
      }
      pre {
        background: #0f172a;
        color: #f8fafc;
        padding: 16px;
        border-radius: 8px;
        overflow-x: auto;
      }
      .status { margin-top: 15px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>PDF Electrical Schematic Extractor</h1>
      <form id="uploadForm" enctype="multipart/form-data">
        <input type="file" name="file" accept="application/pdf" required />
        <button type="submit">Wczytaj PDF</button>
      </form>

      <div id="status" class="status">Brak danych.</div>
      <pre id="result">{}</pre>
    </div>

    <script>
      const form = document.getElementById('uploadForm');
      const status = document.getElementById('status');
      const result = document.getElementById('result');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(form);

        status.textContent = 'Przetwarzanie...';

        try {
          const response = await fetch('/upload', {
            method: 'POST',
            body: formData,
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || 'Błąd przetwarzania');
          }

          status.textContent = 'Gotowe.';
          result.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          status.textContent = 'Błąd';
          result.textContent = JSON.stringify({ error: error.message }, null, 2);
        }
      });
    </script>
  </body>
</html>
